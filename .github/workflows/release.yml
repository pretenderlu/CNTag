name: Release

# Windows 资产在本地构建并随 Release 上传（见 AGENTS.md）。
# Release 发布后自动构建 macOS（Apple Silicon / Intel）DMG，上传到该 Release，并在发布说明中补上下载项。
# 也可在 Actions 中手动运行，指定已存在的 Release 标签。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: AppleSilicon
          - runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches __version__
        run: |
          version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('cntag/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match __version__ $version"
            exit 1
          fi

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build CNTag.app
        run: python build_app.py

      - name: Ad-hoc sign application
        run: |
          codesign --deep --force --sign - dist/CNTag.app
          codesign --verify --deep --strict --verbose=2 dist/CNTag.app

      - name: Create DMG
        # 托管 macOS runner 上 hdiutil 偶尔报 “Resource busy”（后台扫描占用文件），重试即可。
        run: |
          for attempt in 1 2 3; do
            if hdiutil create -volname CNTag -srcfolder dist/CNTag.app -ov -format UDZO "dist/CNTag-macOS-${{ matrix.suffix }}.dmg"; then
              exit 0
            fi
            echo "hdiutil failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: CNTag-macOS-${{ matrix.suffix }}
          path: dist/CNTag-macOS-${{ matrix.suffix }}.dmg
          if-no-files-found: error
          retention-days: 30

  attach:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Upload DMGs to the release
        run: |
          mapfile -t files < <(find packages -type f -name '*.dmg' | sort)
          printf '%s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Add macOS downloads to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          python3 - <<'EOF'
          from pathlib import Path

          path = Path("notes.md")
          lines = path.read_text(encoding="utf-8").rstrip("\n").split("\n")
          if not any("CNTag-macOS-AppleSilicon.dmg" in line for line in lines):
              lines = [line for line in lines if "暂不提供 macOS" not in line]
              mac = ["- Apple Silicon Mac：`CNTag-macOS-AppleSilicon.dmg`", "- Intel Mac：`CNTag-macOS-Intel.dmg`"]
              anchor = next((i for i, line in enumerate(lines) if "CNTag-Windows-x64.zip" in line), None)
              if anchor is None:
                  lines += ["", "Download / 下载：", *mac]
              else:
                  lines[anchor + 1:anchor + 1] = mac
              while lines and not lines[-1].strip():
                  lines.pop()
              lines += ["", "macOS 构建使用 ad-hoc 签名，首次打开需在“系统设置 → 隐私与安全性”中点“仍要打开”，详见 README。"]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          EOF
          cat notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
